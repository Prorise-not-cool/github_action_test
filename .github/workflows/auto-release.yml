name: Release & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ====================================================
  # Job 1: 版本控制中心 (Release Please)
  # ====================================================
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # 输出布尔值：true 代表这是一次正式发版，false 代表只是普通代码合并
      release_created: ${{ steps.release.outputs.release_created }}
      # 输出版本号：例如 v1.2.3
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ====================================================
  # Job 2: 全场景 Docker 构建
  # ====================================================
  publish-docker:
    needs: release-please
    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4
        # 默认检出 main 分支最新代码，这符合 latest 的定义

      - name: 🏷️ 配置动态标签策略
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: prorise123/git-hooks-demo
          # 核心配置：使用 enable 属性控制特定标签是否生成
          tags: |
            # 1. 基础层：Git SHA (调试用) - 每次必打
            type=sha,format=long
            
            # 2. 基础层：Latest (测试环境用) - 每次必打
            type=raw,value=latest
            
            # 3. 生产层：精确版本 (生产环境用) - 仅在 release_created=true 时启用
            type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created }}
            
            # 4. (可选) 语义化次版本 v1.2 - 仅在 release_created=true 时启用
            # 如果 tag_name 是 v1.2.3，此规则会自动提取 v1.2
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🚀 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 自动应用上述 step 生成的所有标签
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max