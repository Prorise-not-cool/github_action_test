name: Release & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # 如果推送到 GitHub Container Registry (GHCR)，需解开下行注释
  # packages: write

jobs:
  # ====================================================
  # Job 1: 核心编排者 (Release Please)
  # ====================================================
  release-please:
    runs-on: ubuntu-latest
    # 将关键结果输出给下游 Job
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


  # ====================================================
  # Job 3: Docker 发布 (下游任务 B)
  # ====================================================
  publish-docker:
    name: 🐳 Publish to Docker Hub
    needs: release-please
    # 只有 Release 真正创建时才运行
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. 检出代码
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4
        with:
          # 关键：显式检出 Release Please 生成的 Tag
          ref: ${{ needs.release-please.outputs.tag_name }}

      # 2. 生成元数据
      - name: 🏷️ 生成 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ⚠️ 替换：你的 Docker Hub 用户名/仓库名
          images: prorise123/git-hooks-demo
          tags: |
            # 强制使用上游传递的版本号 (如 v1.0.0)
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            # 始终更新 latest 标签
            type=raw,value=latest

      # 3. 设置 Buildx 构建环境
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: 🔐 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          # 建议使用 Access Token 而不是密码
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 5. 构建并推送
      - name: 🚀 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 使用步骤 2 定义的强制标签
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 仅构建 AMD64 架构以保证速度 (如需多架构可改为 linux/amd64,linux/arm64)
          platforms: linux/amd64
          # 利用 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max