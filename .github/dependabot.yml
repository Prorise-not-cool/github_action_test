# 必须指定版本为 2
version: 2

updates:
  # 配置 1: 扫描 NPM 依赖
  - package-ecosystem: "pnpm"
    # 扫描根目录下的 package.json
    directory: "/"
    # 设定检查频率：每周一早上 (推荐，避免每天被打扰)
    schedule:
      interval: "daily"
      time: "15:00"
      timezone: "Asia/Shanghai"
    # 指定 PR 的审核人 (填写你的 GitHub 用户名)
    reviewers:
      - "Prorise-cool"

  # 配置 2: 扫描 GitHub Actions 自身引用的更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
      timezone: "Asia/Shanghai"