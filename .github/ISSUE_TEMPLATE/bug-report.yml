name: 🐛 Bug 报告
description: 创建一个 Bug 报告以帮助我们改进
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花费时间报告问题！请确保你已经搜索过现有的 Issue，避免重复提交。
  
  # 必填：问题描述
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述发生了什么问题。
      placeholder: 当我点击登录按钮时，页面变白了...
    validations:
      required: true
  
  # 必填：重现步骤（核心）
  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤
      description: 我们需要具体的步骤来复现这个问题。
      placeholder: |
        1. 进入首页
        2. 点击右上角 '用户' 图标
        3. 输入错误密码
        4. 观察控制台报错
    validations:
      required: true
  
  # 下拉选择：环境信息
  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - 生产环境 (Production)
        - 测试环境 (Staging)
        - 本地开发 (Local)
    validations:
      required: true

  # 必填：日志信息
  - type: textarea
    id: logs
    attributes:
      label: 错误日志/截图
      render: shell  # 会自动格式化为代码块